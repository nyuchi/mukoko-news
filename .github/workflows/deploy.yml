name: Test & Deploy Mukoko News

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  # `vercel/repository-dispatch/actions/status` posts a commit status
  # (statuses: write) and reads this run's job/step conclusions to decide
  # success vs failure (actions: read). Without both it fails at the post step,
  # after the real check has already passed — a confusing way to break CI.
  statuses: write
  actions: read

jobs:
  # ── Repo hygiene linters (file/format checks) ──────────────────────────────
  # These five matrix entries are the branch-protection required checks
  # (lint / actionlint, lint / JSON validity, lint / prettier, …). Keep their
  # names stable so the org ruleset keeps matching them.
  lint:
    runs-on: ubuntu-latest
    name: lint / ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: [actionlint, "JSON validity", prettier, markdownlint, yamllint]

    steps:
    # Reports this check to Vercel as a named commit status.
    #
    # MUST be the first step. The action registers a `post` hook, and the hook is
    # what actually reports the outcome: it scans this job's steps for a failure
    # once they have all run. A step that is never reached never registers its
    # post hook, so placing this at the end would report nothing in exactly the
    # case that matters — a failing check.
    - name: Notify Vercel
      uses: vercel/repository-dispatch/actions/status@v1
      env:
        # On a `pull_request` event GITHUB_SHA is the ephemeral MERGE commit
        # (refs/pull/N/merge), not the PR head, and this action reads
        # `context.sha` straight out of that variable. Without the override it
        # posts to a commit GitHub never displays: verified in run 34425929192,
        # where it set the status on 18e10b1 (the merge ref) while the PR head
        # was 92b65cf — the check ran, passed, and was invisible on the PR.
        # `github.event.pull_request` is null on push, so this falls back cleanly.
        GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      with:
        name: 'Vercel - mukoko-news: lint / ${{ matrix.check }}'

    - uses: actions/checkout@v4

    - name: Run actionlint
      if: matrix.check == 'actionlint'
      uses: raven-actions/actionlint@v2

    - name: Validate JSON files
      if: matrix.check == 'JSON validity'
      run: |
        find . \
          -name "*.json" \
          -not -path "*/node_modules/*" \
          -not -path "*/.git/*" \
          -not -path "*/.next/*" \
          -not -path "*/.wrangler/*" \
          -not -path "*/.venv/*" \
          -not -path "*/dist/*" \
          | while read -r f; do
              python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
            done

    - name: Setup Node.js
      if: matrix.check == 'prettier'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run prettier
      if: matrix.check == 'prettier'
      run: |
        npm install --no-save prettier@3
        npx prettier --check "**/*.json"

    - name: Run markdownlint
      if: matrix.check == 'markdownlint'
      uses: DavidAnson/markdownlint-cli2-action@v16
      with:
        globs: "**/*.md"

    - name: Run yamllint
      if: matrix.check == 'yamllint'
      run: |
        pip install yamllint
        yamllint -c .yamllint.yml .

  # ── Frontend pipeline ──────────────────────────────────────────────────────
  # Sequential stages (ESLint → Typecheck → Test → Build) so the Actions graph
  # shows a clear pipeline and pinpoints exactly which stage failed, instead of
  # bundling everything into one opaque job.
  eslint:
    runs-on: ubuntu-latest
    name: ESLint
    steps:
    - name: Notify Vercel
      uses: vercel/repository-dispatch/actions/status@v1
      env:
        # On a `pull_request` event GITHUB_SHA is the ephemeral MERGE commit
        # (refs/pull/N/merge), not the PR head, and this action reads
        # `context.sha` straight out of that variable. Without the override it
        # posts to a commit GitHub never displays: verified in run 34425929192,
        # where it set the status on 18e10b1 (the merge ref) while the PR head
        # was 92b65cf — the check ran, passed, and was invisible on the PR.
        # `github.event.pull_request` is null on push, so this falls back cleanly.
        GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      with:
        name: 'Vercel - mukoko-news: ESLint'

    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - name: Run ESLint
      run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    name: Typecheck
    needs: eslint
    steps:
    - name: Notify Vercel
      uses: vercel/repository-dispatch/actions/status@v1
      env:
        # On a `pull_request` event GITHUB_SHA is the ephemeral MERGE commit
        # (refs/pull/N/merge), not the PR head, and this action reads
        # `context.sha` straight out of that variable. Without the override it
        # posts to a commit GitHub never displays: verified in run 34425929192,
        # where it set the status on 18e10b1 (the merge ref) while the PR head
        # was 92b65cf — the check ran, passed, and was invisible on the PR.
        # `github.event.pull_request` is null on push, so this falls back cleanly.
        GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      with:
        name: 'Vercel - mukoko-news: Typecheck'

    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - name: Run tsc --noEmit
      run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    name: Test
    needs: typecheck
    steps:
    - name: Notify Vercel
      uses: vercel/repository-dispatch/actions/status@v1
      env:
        # On a `pull_request` event GITHUB_SHA is the ephemeral MERGE commit
        # (refs/pull/N/merge), not the PR head, and this action reads
        # `context.sha` straight out of that variable. Without the override it
        # posts to a commit GitHub never displays: verified in run 34425929192,
        # where it set the status on 18e10b1 (the merge ref) while the PR head
        # was 92b65cf — the check ran, passed, and was invisible on the PR.
        # `github.event.pull_request` is null on push, so this falls back cleanly.
        GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      with:
        name: 'Vercel - mukoko-news: Test'

    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - name: Run Vitest
      run: npm run test

  build:
    runs-on: ubuntu-latest
    name: Build
    needs: test
    steps:
    - name: Notify Vercel
      uses: vercel/repository-dispatch/actions/status@v1
      env:
        # On a `pull_request` event GITHUB_SHA is the ephemeral MERGE commit
        # (refs/pull/N/merge), not the PR head, and this action reads
        # `context.sha` straight out of that variable. Without the override it
        # posts to a commit GitHub never displays: verified in run 34425929192,
        # where it set the status on 18e10b1 (the merge ref) while the PR head
        # was 92b65cf — the check ran, passed, and was invisible on the PR.
        # `github.event.pull_request` is null on push, so this falls back cleanly.
        GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      with:
        name: 'Vercel - mukoko-news: Build'

    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - name: Build Next.js
      run: npm run build
